kind = "mobile"
previewPath = "/"
title = "Recall — 自分だけの問題集"
description = "日本語のオフライン学習アプリ。問題集と分類の管理、○×・選択式問題、演習、学習ステータス、端末内SQLite保存、CSV入出力に対応。"
version = "1.0.0"
id = "artifacts/recall"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24864

[services.development]
run = "pnpm --filter @workspace/recall run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/recall", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/recall", "run", "serve" ]

[services.env]
PORT = "24864"
BASE_PATH = "/"
